# Halcyon Corne (rev2), wireless controllers, coin cell battery boards and
# e-paper display modules. The e-paper image can be forest, mountain or cityscape.
#
# Without a dongle: the left half is the central and connects to the computer.
include:
  - board: halcyon_wireless//zmk
    shield: halcyon_corne_left mod_battery_coincell mod_display_epaper_forest
  - board: halcyon_wireless//zmk
    shield: halcyon_corne_right mod_battery_coincell mod_display_epaper_forest

# Settings reset firmware for each half (flash to clear stale Bluetooth bonds
# if the halves will not pair). Uncomment when needed.
#  - board: halcyon_wireless//zmk
#    shield: settings_reset
#    artifact-name: settings_reset_wireless

# With a dongle: comment out the two left/right entries above and use these
# instead. The dongle is the central, so the left half becomes a peripheral
# (CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n). The right half build is the same as above.
#  - board: halcyon_dongle//zmk
#    shield: halcyon_corne_dongle
#  - board: halcyon_wireless//zmk
#    shield: halcyon_corne_left mod_battery_coincell mod_display_epaper_forest
#    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
#  - board: halcyon_wireless//zmk
#    shield: halcyon_corne_right mod_battery_coincell mod_display_epaper_forest
